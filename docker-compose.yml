services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    ports:
      - "10000:10000"
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --inMemoryPersistence
      - --disableTelemetry
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 2s
      timeout: 2s
      retries: 30

